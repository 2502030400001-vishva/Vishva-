
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple AI Chatbot</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef6ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.chatbox {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #ccd6e0;
}

h2 {
    text-align: center;
    color: #087fbb;
}

#messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    background: #f7faff;
    border-radius: 10px;
    margin-bottom: 12px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    overflow-wrap: anywhere;
}

.user {
    background: #d5eaff;
    text-align: right;
}

.bot {
    background: #e1f7e9;
}

.controls {
    display: flex;
    gap: 8px;
}

input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 12px;
    background: #087fbb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="chatbox">
    <h2>🤖 My AI Assistant</h2>

    <div id="messages">
        <div class="message bot">
            Hello! I am your AI assistant. Ask me anything!
        </div>
    </div>

    <div class="controls">
        <input id="question"
               type="text"
               placeholder="Type your question..."
               onkeydown="if(event.key==='Enter') sendMessage()">

        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("question");
    let question = input.value.trim().toLowerCase();
    let messages = document.getElementById("messages");

    if (question === "") return;

    messages.innerHTML +=
        '<div class="message user"></div>';

    messages.lastElementChild.textContent = input.value;

    let answer = "Sorry, I don't know that yet!";

    if (question.includes("hello") ||
        question.includes("hi")) {
        answer = "Hello! How can I help you?";
    }
    else if (question.includes("your name")) {
        answer = "I am your AI Assistant!";
    }
    else if (question.includes("how are you")) {
        answer = "I am fine! Thank you for asking.";
    }
    else if (question.includes("html")) {
        answer = "HTML is used to create web pages.";
    }
    else if (question.includes("ai")) {
        answer = "AI means Artificial Intelligence.";
    }
    else if (question.includes("thank")) {
        answer = "You're welcome!";
    }
    else if (question.includes("bye")) {
        answer = "Goodbye! Have a nice day.";
    }

    messages.innerHTML +=
        '<div class="message bot"></div>';

    messages.lastElementChild.textContent = answer;

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
  </html>
